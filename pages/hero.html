<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="design-system.css" />

  <style>

    /* ------------------------------------------------
       HERO
    ------------------------------------------------ */

    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: center;

      /* Cambia esta URL por la imagen de tu proyecto */
      background-image: url('https://images.unsplash.com/photo-1526772662000-3f88f10405ff?w=1600&q=80');
      background-size: cover;
      background-position: center;
    }

    /* Overlay — usando el azul del sistema */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgb(255, 255, 255);   /* --color-azul al 65% */
    }

    /* Contenido sobre el overlay */
    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 700px;
    }

    /* Eyebrow / etiqueta sobre el h1 */
    .hero__eyebrow {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--color-beige);
      margin-bottom: var(--space-03);
    }

    .hero__content h1 {
      color: var(--color-blanco);
      margin-bottom: var(--space-04);
    }

    .hero__content h2 {
      color: rgba(255, 255, 255, 0.75);
      font-weight: 400;
      font-size: 20px;
      letter-spacing: var(--ls-body);
      margin-bottom: var(--space-06);
    }

    .hero__actions {
      display: flex;
      align-items: center;
      gap: var(--space-04);
      flex-wrap: wrap;
    }

    /* Secundario sobre fondo oscuro — borde y texto en blanco */
    .hero .btn-secondary {
      border-color: rgba(255, 255, 255, 0.7);
      color: var(--color-blanco);
    }
    .hero .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--color-blanco);
      color: var(--color-blanco);
    }

    /* Mobile */
    @media (max-width: 768px) {
      .hero { min-height: 100svh; align-items: flex-end; padding-bottom: var(--space-08); }
      .hero__actions { flex-direction: column; }
      .hero__actions .btn { width: 100%; justify-content: center; }
    }

  </style>
</head>
<body>

  <section class="hero">
    <div class="container">
      <div class="hero__content">
        <span class="hero__eyebrow">Agencia de viajes</span>
        <h1>Vive experiencias que no olvidarás</h1>
        <h2>Descubre destinos únicos en Perú, Argentina, Cartagena y Medellín con rutas diseñadas para ti.</h2>
        <div class="hero__actions">
          <button class="btn btn-primary">Ver destinos</button>
          <button class="btn btn-secondary">Saber más</button>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
