<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-8">

  <h1 class="text-2xl font-bold mb-4">Contáctanos</h1>

  <form class="bg-white p-6 rounded shadow-md">

    <input type="text" placeholder="Nombre" class="w-full mb-4 p-2 border rounded">
    
    <input type="email" placeholder="Correo" class="w-full mb-4 p-2 border rounded">
    
    <textarea placeholder="Mensaje" class="w-full mb-4 p-2 border rounded"></textarea>

    <button class="bg-blue-500 text-white px-4 py-2 rounded">
      Enviar
    </button>

  </form>

</body>
</html>
